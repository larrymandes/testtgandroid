name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "APP_ID=6" >> local.properties
          echo "APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e" >> local.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
