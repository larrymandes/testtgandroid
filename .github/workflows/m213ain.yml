name: Check Gradle tasks

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: List assemble tasks
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:tasks --all --no-daemon | grep -i assemble
